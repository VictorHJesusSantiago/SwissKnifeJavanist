name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["21", "25"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./test.ps1
      - if: runner.os != 'Windows'
        shell: bash
        run: chmod +x build.sh test.sh && ./test.sh
      - if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        shell: bash
        run: |
          java -jar build/swissknife.jar quality src/main/java --format sarif --output build/quality.sarif
          java -jar build/swissknife.jar security-scan . --format sarif --output build/security.sarif
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        with:
          name: swissknife-reports
          path: build/*.sarif
  spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f spring-backends/pom.xml test
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle buildPlugin verifyPlugin
        working-directory: intellij-plugin
