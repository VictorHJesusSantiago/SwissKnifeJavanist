source.url=jdbc:h2:file:./data/source
source.user=sa
source.passwordEnv=SOURCE_DATABASE_PASSWORD
source.table=customers
target.url=jdbc:h2:file:./data/target
target.user=sa
target.passwordEnv=TARGET_DATABASE_PASSWORD
target.table=customers
batchSize=500
fetchSize=500
where=active = true
conflictPolicy=SKIP
errorPolicy=CONTINUE
dryRun=true
checkpointFile=./data/migration-checkpoint.json
rejectFile=./data/migration-rejected.jsonl
map.full_name=name
transform.email=lowercase
